dev_dependencies:
  freezed: 
    git: https://github.com/kumsumit/freezed.git
  shared_preferences:
    git: https://github.com/kumsumit/shared_preferences.git
  # integration_test:
  #   sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  riverpod_generator:
    git: https://github.com/kumsumit/riverpod_generator.git
  riverpod_lint:
    git: https://github.com/kumsumit/riverpod_lint.git
  icons_launcher:
    git: "https://github.com/kumsumit/icons_launcher.git"   
  remove_unused_localizations_keys: ^0.0.40   
  integration_test:
    sdk: flutter
  

dependency_overrides: 
  path_provider:
    git: https://github.com/kumsumit/path_provider.git
  shared_preferences:
    git: https://github.com/kumsumit/shared_preferences.git
  plugin_platform_interface:
    git: https://github.com/kumsumit/plugin_platform_interface.git
  meta: ^1.19.0    

flutter:
  uses-material-design: true
  assets:
    - assets/
    - shorebird.yaml
  fonts:
    - family: K
      fonts:
        - asset: assets/fonts/K.ttf

flutter_native_splash: 
  color: '#9fd09f'
  color_dark: '#000f0f'
  android: true
  ios: true
  image_android: 'logo_light.png'
  image_dark_android: 'logo_dark.png'
  image_ios: 'logo_light.png'
  image_dark_ios: 'logo_dark.png'
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: '#9fd09f'
    color_dark: '#000f0f'
    image: 'android_12_light.png'
    image_dark: 'android_12_dark.png'

icons_launcher:
  platforms:
    android:
      enable: true
      image_path: "logos/legacy.png"
      adaptive_background_color: "#9fd09f"
      adaptive_foreground_image: "logos/adaptive.png"
      # adaptive_round_foreground_image: "logos/circle.png"
      adaptive_monochrome_image: "logos/monochrome.png"

    ios:
      enable: true
      image_path: "logos/legacy.png"
             
#  logo_color: #161f2cff            
